
name: CarbClient Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build CarbClient
        run: gradle build --no-daemon

      - name: Upload CarbClient JAR
        uses: actions/upload-artifact@v4
        with:
          name: CarbClient-1.21.4
          path: build/libs/*.jar
          if-no-files-found: error
